<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Gold4x — P2P Audit</title>
<!--
  Self-contained. No server, no build step, no network required for the data,
  no CDN, no fonts. Open this file directly from the Files app on iOS or Android.

  Generated by scripts/buildOfflineAudit.mjs from p2p-audit.json.
  Do not hand-edit the data block: it is inlined at build time.

  It holds 391 people's PAN, bank account, IFSC, mobile, email and Aadhaar
  images. Treat the file itself as the secret, not just the contents.
-->
<style>
:root {
  --bg: #08090c;
  --panel: rgba(255,255,255,.022);
  --line: rgba(255,255,255,.075);
  --line-soft: rgba(255,255,255,.045);
  --ink: #ece8e1;
  --muted: #9c968b;
  --subtle: #6f6a61;
  --gold: #d4a843;
  --emerald-bright: #5fd3b8;
  --red: #d84c4c;
  --red-bright: #f0a0a0;
  --blue: #4a7fb5;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(212,168,67,.10), transparent 60%),
    radial-gradient(800px 460px at 88% 4%, rgba(45,139,120,.10), transparent 60%);
}
.wrap {
  position: relative; z-index: 1; max-width: 1500px; margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom));
}
a { color: var(--blue); }
h1 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: -.01em; font-weight: 650; }
.sub { color: var(--subtle); font-size: .74rem; font-family: var(--mono); line-height: 1.7; }
.sub b { color: var(--muted); font-weight: 500; }

/* ---------- header ---------- */
header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
.offline { display: none; margin-bottom: 14px; padding: 10px 13px; border-radius: 10px;
  border: 1px solid rgba(212,168,67,.3); background: rgba(212,168,67,.06); color: #e8d5a8; font-size: .78rem; line-height: 1.5; }
.offline.is-on { display: block; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin-bottom: 18px; }
.stat { padding: 12px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.stat__k { color: var(--subtle); font-size: .62rem; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }
.stat__v { font-family: var(--mono); font-size: 1.12rem; font-weight: 600; letter-spacing: -.02em; overflow-wrap: anywhere; }
.stat__d { font-size: .65rem; color: var(--subtle); margin-top: 2px; line-height: 1.45; }
.stat--alert { border-color: rgba(216,76,76,.34); background: rgba(216,76,76,.06); }
.stat--alert .stat__v { color: var(--red-bright); }
.stat--good .stat__v { color: var(--emerald-bright); }

/* ---------- funds ---------- */
.funds { margin-bottom: 18px; }
.funds__t { color: var(--subtle); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
.funds__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 9px; }
.fund { padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); display: flex; flex-direction: column; gap: 3px; }
.fund--stuck { border-color: rgba(216,76,76,.36); background: rgba(216,76,76,.06); }
.fund--owner { border-color: rgba(212,168,67,.3); background: rgba(212,168,67,.05); }
.fund--wait { border-color: rgba(74,127,181,.28); background: rgba(74,127,181,.04); }
.fund__k { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); }
.fund__v { font-family: var(--mono); font-size: 1.16rem; font-weight: 600; letter-spacing: -.02em; }
.fund--stuck .fund__v { color: var(--red-bright); }
.fund--owner .fund__v { color: var(--gold); }
.fund--wait .fund__v { color: #8fbde8; }
.fund__n { font-size: .64rem; color: var(--subtle); }
.fund__r { margin: .35rem 0 0; font-size: .7rem; line-height: 1.5; color: var(--muted); }

/* ---------- tabs + controls ---------- */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 13px; color: var(--subtle); font: inherit; font-size: .83rem;
  cursor: pointer; white-space: nowrap; transition: color .18s ease, border-color .18s ease;
}
.tab.is-active { color: var(--gold); border-bottom-color: var(--gold); }
.tab .n { font-family: var(--mono); font-size: .7rem; opacity: .75; margin-left: 4px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 13px; }
input[type=search], select {
  background: rgba(0,0,0,.34); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 11px; color: var(--ink); font: inherit; font-size: .82rem; min-height: 40px;
}
input[type=search] { min-width: 200px; flex: 1 1 200px; }
select { flex: 0 1 auto; }
input[type=search]:focus, select:focus { outline: none; border-color: rgba(212,168,67,.45); }
.hint { color: var(--subtle); font-size: .72rem; margin-left: auto; font-family: var(--mono); }
.jump {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 9px;
  border: 1px solid rgba(212,168,67,.35); background: rgba(212,168,67,.07);
  color: var(--gold); font-size: .74rem; line-height: 1.5;
}
.btn {
  appearance: none; cursor: pointer; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03); color: var(--muted); font: inherit; font-size: .76rem;
  padding: 8px 12px; min-height: 38px;
}
.btn:hover { border-color: rgba(212,168,67,.35); color: var(--gold); }

/* ---------- rows ---------- */
.row { border: 1px solid var(--line); border-radius: 11px; background: var(--panel); margin-bottom: 7px; overflow: hidden; }
.row__head {
  display: grid; grid-template-columns: 3.6rem minmax(0,1fr) auto auto 1.1rem;
  gap: 12px; align-items: center; width: 100%; padding: 12px 13px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.row__head:hover { background: rgba(255,255,255,.022); }
.row__id { font-family: var(--mono); font-weight: 600; color: var(--gold); }
.row__pair { font-size: .82rem; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
.row__pair b { color: var(--ink); font-weight: 600; }
.row__amt { font-family: var(--mono); font-size: .8rem; line-height: 1.6; text-align: right; white-space: nowrap; }
.implied { color: var(--subtle); font-size: .68rem; }
.mono { font-family: var(--mono); font-size: .72rem; opacity: .75; }
.caret { color: var(--subtle); text-align: center; transition: transform .18s ease; font-size: .66rem; }
.row.is-open .caret { transform: rotate(90deg); }
.row__badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 14rem; }
.row__body { padding: 4px 14px 16px; border-top: 1px solid var(--line-soft); }

.chip {
  display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: .62rem;
  font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent;
}
.chip--OPEN      { background: rgba(212,168,67,.14); color: var(--gold); border-color: rgba(212,168,67,.32); }
.chip--PAID      { background: rgba(74,127,181,.16); color: #8fbde8; border-color: rgba(74,127,181,.4); }
.chip--COMPLETED { background: rgba(45,139,120,.16); color: var(--emerald-bright); border-color: rgba(45,139,120,.4); }
.chip--CANCELLED { background: rgba(255,255,255,.05); color: var(--subtle); border-color: var(--line); }
.chip--ACTIVE    { background: rgba(45,139,120,.16); color: var(--emerald-bright); border-color: rgba(45,139,120,.4); }
.chip--FILLED    { background: rgba(74,127,181,.14); color: #8fbde8; border-color: rgba(74,127,181,.34); }
.chip--override  { background: rgba(216,76,76,.16); color: var(--red-bright); border-color: rgba(216,76,76,.42); }
.chip--done      { background: rgba(45,139,120,.14); color: var(--emerald-bright); border-color: rgba(45,139,120,.36); }
.chip--closed    { background: rgba(255,255,255,.05); color: var(--subtle); border-color: var(--line); }
.chip--stuck     { background: rgba(216,76,76,.14); color: var(--red-bright); border-color: rgba(216,76,76,.36); }
.chip--sell      { border-color: rgba(120,200,255,.5); color: #9ad4ff; background: rgba(120,200,255,.1); }
.chip--buy       { border-color: rgba(255,200,120,.5); color: #ffcf8a; background: rgba(255,200,120,.1); }
.chip--plain     { background: rgba(255,255,255,.04); color: var(--muted); border-color: var(--line); }

/* clickable address */
.addr {
  appearance: none; background: none; border: 0; padding: 0; margin: 0; font: inherit;
  font-family: var(--mono); color: #7fb0dd; cursor: pointer;
  border-bottom: 1px dotted rgba(127,176,221,.5);
}
.addr:hover { color: var(--gold); border-bottom-color: var(--gold); }

/* ---------- detail ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.blk { border: 1px solid var(--line-soft); border-radius: 11px; padding: 12px 13px; background: rgba(0,0,0,.2); min-width: 0; }
.blk__t { color: var(--subtle); font-size: .62rem; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.count { display: inline-block; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--subtle); font-size: .58rem; letter-spacing: 0; }
.dl { margin: 0; }
.kv {
  display: flex; justify-content: space-between; align-items: baseline; gap: 1.1rem;
  padding: .5rem 0; border-bottom: 1px solid var(--line-soft); font-size: .79rem; line-height: 1.5;
}
.kv:last-child { border-bottom: 0; }
.kv dt { color: var(--subtle); flex-shrink: 0; line-height: 1.5; }
.kv dd {
  margin: 0; font-family: var(--mono); font-size: .74rem; line-height: 1.5; text-align: right;
  overflow-wrap: anywhere; word-break: normal; min-width: 0;
}
.reason { padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(74,127,181,.28); background: rgba(74,127,181,.05); margin-bottom: 10px; }
.reason.is-stuck { border-color: rgba(216,76,76,.38); background: rgba(216,76,76,.06); }
.reason__t { font-size: .61rem; letter-spacing: .06em; text-transform: uppercase; color: #8fbde8; font-weight: 600; margin-bottom: 4px; }
.reason.is-stuck .reason__t { color: var(--red-bright); }
.reason p { margin: 0 0 4px; font-size: .74rem; line-height: 1.5; color: var(--muted); }

table.tbl { width: 100%; border-collapse: collapse; font-size: .73rem; margin-top: 6px; }
.tbl th { padding: 7px 7px; border-bottom: 1px solid rgba(255,255,255,.1); font-size: .55rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-align: left; color: var(--subtle); }
.tbl td { padding: 7px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; line-height: 1.5; }
.tbl .n { text-align: right; font-family: var(--mono); font-size: .69rem; }
.tbl .w { white-space: nowrap; font-size: .63rem; color: var(--subtle); }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.tl { display: grid; gap: 9px; }
.ev { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 10px; align-items: start; font-size: .77rem; }
.ev__t { font-family: var(--mono); font-size: .68rem; color: var(--subtle); padding-top: 2px; }
.ev__n { color: var(--gold); font-family: var(--mono); font-size: .72rem; }
.ev__m { color: var(--muted); overflow-wrap: anywhere; }

/* chat transcript */
.aline { display: grid; grid-template-columns: 9.5rem 4rem 3rem minmax(0,1fr); gap: 12px; align-items: start; padding: 9px 11px; border-bottom: 1px solid var(--line-soft); font-size: .75rem; line-height: 1.6; }
.aline:last-child { border-bottom: 0; }
.aline__when { font-family: var(--mono); font-size: .62rem; color: var(--subtle); white-space: nowrap; }
.aline__role { padding: 2px 5px; border-radius: 3px; font-size: .52rem; font-weight: 700; letter-spacing: .05em; text-align: center; align-self: center; }
.aline__role--sold { background: rgba(120,200,255,.14); color: #9ad4ff; }
.aline__role--bought { background: rgba(255,200,120,.14); color: #ffcf8a; }
.aline__trade { font-size: .64rem; }
.aline__body { min-width: 0; overflow-wrap: anywhere; }
.aline__body img { max-width: 100%; max-height: 12rem; border: 1px solid rgba(255,255,255,.12); border-radius: 5px; cursor: zoom-in; }
.msg { padding: 7px 9px; border-radius: 9px; background: rgba(255,255,255,.03); border: 1px solid var(--line-soft); }
.msg__h { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: .66rem; color: var(--subtle); margin-bottom: 3px; }
.msg__x { font-size: .79rem; overflow-wrap: anywhere; }

/* images */
.shot { display: flex; flex-direction: column; gap: 5px; }
.shot img { width: 100%; max-width: 260px; max-height: 17rem; object-fit: contain; background: #000; border-radius: 9px; border: 1px solid var(--line); display: block; }
.shot a { color: var(--blue); font-family: var(--mono); font-size: .66rem; overflow-wrap: anywhere; }
.imgfail { padding: 9px 11px; border-radius: 9px; border: 1px dashed rgba(216,76,76,.34); background: rgba(216,76,76,.05); font-size: .72rem; line-height: 1.5; color: #eec4c4; }
.imgfail code { font-family: var(--mono); font-size: .64rem; overflow-wrap: anywhere; display: block; margin: 4px 0; }

/* ---------- drawer ---------- */
.drw { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.drw__scrim { position: absolute; inset: 0; background: rgba(0,0,0,.68); }
.drw__panel {
  position: relative; width: min(760px, 100%); height: 100%; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 18px 18px calc(48px + env(safe-area-inset-bottom));
  background: #0b0c10; border-left: 1px solid rgba(255,255,255,.09);
  animation: slidein .2s ease;
}
@keyframes slidein { from { transform: translateX(16px); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .drw__panel { animation: none } }
@media (max-width: 700px) { .drw__panel { width: 100%; border-left: 0 } }
.drw__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.drw__head h2 { margin: 0 0 3px; font-size: 1rem; font-weight: 600; }
.drw__addr { font-family: var(--mono); font-size: .68rem; color: #7fb0dd; text-decoration: none; overflow-wrap: anywhere; }
.drw__x { appearance: none; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex-shrink: 0; font-size: 1rem; }
.drw__badges { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.drw__note { margin: 12px 0 0; font-size: .67rem; line-height: 1.5; color: var(--subtle); }
.drw__h3 { margin: 1.4rem 0 .6rem; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); font-weight: 600; display: flex; gap: 7px; align-items: center; }
.docs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 620px) { .docs { grid-template-columns: 1fr } }
.doc { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: rgba(0,0,0,.3); }
.doc__zoom { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 3rem; border: 0; padding: 0; background: #000; cursor: zoom-in; position: relative; }
.doc__zoom img { display: block; width: 100%; height: auto; max-height: 26rem; object-fit: contain; background: #000; }
.doc__zoom::after { content: 'tap to enlarge'; position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.72); color: rgba(255,255,255,.82); font-size: .55rem; letter-spacing: .04em; text-transform: uppercase; opacity: 0; transition: opacity .15s ease; }
.doc__zoom:active::after { opacity: 1; }
.doc__cap { display: block; padding: 7px 9px; font-size: .64rem; color: var(--subtle); }
.doc__cap a { font-family: var(--mono); }
.doc--empty { padding: 11px; font-size: .68rem; line-height: 1.5; color: var(--muted); }
.doc__t { display: block; font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); margin-bottom: 3px; }
.empty { color: var(--subtle); font-size: .77rem; font-style: italic; line-height: 1.5; }
.banner { padding: 11px 13px; border-radius: 11px; border: 1px solid rgba(216,76,76,.34); background: rgba(216,76,76,.07); color: #f0c0c0; font-size: .79rem; margin-bottom: 14px; line-height: 1.55; }
.banner b { color: var(--red-bright); }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.93); display: flex; align-items: center; justify-content: center; padding: 12px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ---------- responsive ---------- */
@media (max-width: 780px) {
  .row__head { grid-template-columns: 3.2rem minmax(0,1fr) auto 1rem; gap: 10px; }
  .row__badges { grid-column: 1 / -1; max-width: none; justify-content: flex-start; margin-top: 4px; }
  .aline { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .aline__when { order: -1; }
  .ev { grid-template-columns: minmax(0,1fr); gap: 3px; }
  .grid { grid-template-columns: minmax(0,1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>P2P Escrow — Audit</h1>
      <div class="sub" id="meta">loading…</div>
    </div>
    <div class="sub" id="contract"></div>
  </header>

  <div class="offline" id="offline"></div>
  <div id="alert"></div>
  <div class="stats" id="stats"></div>
  <div class="funds" id="funds"></div>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="trades" role="tab">Trades <span class="n" id="n-trades"></span></button>
    <button class="tab" data-tab="ads" role="tab">Orders <span class="n" id="n-ads"></span></button>
    <button class="tab" data-tab="people" role="tab">Verified users <span class="n" id="n-kyc"></span></button>
  </div>

  <div class="controls" id="controls"></div>
  <div id="list"></div>
</div>

<script id="audit-data" type="application/json">__AUDIT_DATA__</script>
<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const sh = (a) => (a ? String(a).slice(0, 6) + '…' + String(a).slice(-4) : '—');
const dt = (iso) => (iso ? String(iso).replace('T', ' ').slice(0, 19) + ' UTC' : '—');
const bscTx = (h) => (h ? 'https://bscscan.com/tx/' + h : null);
const bscAd = (a) => (a ? 'https://bscscan.com/address/' + a : null);
const CID = /^(Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{58,})$/;
const realCid = (v) => CID.test(String(v ?? '').trim());

let DATA = null;
let KYC = new Map();
let PEOPLE = new Map();
let TAB = 'trades';
let PIN = null;
const OPEN = new Set();

function lag(from, to) {
  if (!from || !to) return null;
  const ms = new Date(to).getTime() - new Date(from).getTime();
  if (!isFinite(ms) || ms < 0) return null;
  const m = Math.round(ms / 60000);
  if (m < 1) return 'under a minute later';
  if (m < 60) return m + ' min later';
  const h = Math.round(ms / 3600000);
  if (h < 48) return h + ' h later';
  return Math.round(ms / 86400000) + ' days later';
}

const tcount = (p) => p.tradesAsSeller.length + p.tradesAsBuyer.length;

/* ---------------- gateways ---------------- */
/* Retry the primary gateway before falling through: the alternates answer 429
   far more often than Pinata does. A slow gateway and a missing file look
   identical otherwise, so the retry happens first and failure is explicit. */
const GATEWAYS = [
  { u: (c) => 'https://gateway.pinata.cloud/ipfs/' + c, retries: 3 },
  { u: (c) => 'https://dweb.link/ipfs/' + c, retries: 1 },
  { u: (c) => 'https://ipfs.io/ipfs/' + c, retries: 1 },
];

function imgBox(cid, alt, boxClass) {
  if (!realCid(cid)) {
    return '<div class="doc--empty"><span class="doc__t">No document</span>' +
      'The contract stores <code>' + esc(cid) + '</code> as a placeholder, not an image.</div>';
  }
  const id = 'i' + Math.random().toString(36).slice(2, 9);
  return '<div class="' + (boxClass || 'shot') + '" data-img="' + esc(cid) + '" id="' + id + '">' +
    '<div class="imgfail" style="display:none">Could not load from any gateway. The CID is recorded on-chain regardless.</div>' +
    '<a href="' + esc(GATEWAYS[0].u(cid)) + '" target="_blank" rel="noopener">' +
    '<img alt="' + esc(alt) + '" loading="lazy" src="' + esc(GATEWAYS[0].u(cid)) + '" /></a></div>';
}

/* Retry cascade, bound to the whole page so late arrivals still work. */
function wireImages(root) {
  $$('[data-img]', root || document).forEach(box => {
    const cid = box.dataset.img;
    const img = $('img', box);
    if (!img) return;
    let stage = 0, attempt = 0, loaded = false, dead = false;
    img.onerror = () => {
      if (dead) return;
      const max = GATEWAYS[stage].retries;
      if (attempt < max) {
        attempt++;
        setTimeout(() => { img.src = GATEWAYS[stage].u(cid) + '?r=' + attempt; }, 600 * Math.pow(2, attempt - 1));
      } else if (stage + 1 < GATEWAYS.length) {
        stage++; attempt = 0;
        setTimeout(() => { img.src = GATEWAYS[stage].u(cid); }, 300);
      } else {
        dead = true;
        img.style.display = 'none';
        const f = $('.imgfail', box);
        if (f) {
          f.style.display = 'block';
          f.innerHTML = 'Could not load from any gateway. The CID is recorded on-chain regardless.<code>' + esc(cid) + '</code>';
        }
      }
    };
    img.onload = () => { loaded = true; img.style.visibility = 'visible'; };
    img.style.visibility = 'visible';
  });
}

/* Lightbox. Tapping an image opens it full size, because a 12-digit Aadhaar
   number cannot be read from a thumbnail. */
function wireLightbox(root) {
  $$('img[data-img], [data-img] img', root || document).forEach(img => {
    img.style.cursor = 'zoom-in';
    img.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const box = document.createElement('div');
      box.className = 'lightbox';
      box.innerHTML = '<img src="' + img.src + '" alt="" />';
      box.onclick = () => box.remove();
      document.body.appendChild(box);
    };
  });
}

/* ---------------- header blocks ---------------- */
function statsBlock(s) {
  const cards = [
    ['Trades', s.trades, (s.tradesByStatus.OPEN || 0) + ' open · ' + (s.tradesByStatus.PAID || 0) + ' paid'],
    ['Completed', s.tradesByStatus.COMPLETED || 0, (s.tradesByStatus.CANCELLED || 0) + ' cancelled'],
    ['Orders', s.ads, s.adsActive + ' still active'],
    ['Owner overrides', s.ownerOverrides, 'forced release or refund'],
    ['Escrow balance', s.escrowBalanceJSAV + ' JSAV', s.escrowedInOpenTrades + ' backs open trades'],
    ['Unattributed', s.escrowUnattributed + ' JSAV', 'held by no open trade', Number(s.escrowUnattributed) > 0.0001 ? 'alert' : 'good'],
    ['Chat messages', s.chatMessages, 'on-chain'],
    ['Payment screenshots', s.realScreenshots, 'real images'],
    ['KYC verified', s.kyc.verified, s.kyc.decoded + ' records · ' + s.kyc.withAadhaarFront + ' with Aadhaar'],
  ];
  return cards.map(([k, v, d, mod]) =>
    '<div class="stat' + (mod ? ' stat--' + mod : '') + '"><div class="stat__k">' + esc(k) +
    '</div><div class="stat__v">' + esc(v) + '</div><div class="stat__d">' + esc(d) + '</div></div>'
  ).join('');
}

function fundsBlock(s) {
  const cards = [];
  cards.push(['stuck', 'Stuck — needs cancelling', s.stuck.valueJSAV + ' JSAV', s.stuck.trades + ' trades · ' + s.stuck.ids.length + ' listed', s.stuck.reason]);
  cards.push(['wait', 'Awaiting buyer payment', s.awaitingBuyer.valueJSAV + ' JSAV', s.awaitingBuyer.trades + ' trades', s.awaitingBuyer.reason]);
  cards.push(['wait', 'Awaiting seller confirmation', s.awaitingSeller.valueJSAV + ' JSAV', s.awaitingSeller.trades + ' trades', s.awaitingSeller.reason]);
  if (Number(s.escrowUnattributed) > 0.0001) {
    cards.push(['owner', 'Unattributed', s.escrowUnattributed + ' JSAV', 'cannot be traded or claimed', s.escrowUnattributedReason]);
  }
  return '<div class="funds__t">Escrow funds by cause</div><div class="funds__grid">' +
    cards.map(([mod, k, v, n, r]) =>
      '<div class="fund fund--' + mod + '"><div class="fund__k">' + esc(k) + '</div>' +
      '<div class="fund__v">' + esc(v) + '</div><div class="fund__n">' + esc(n) + '</div>' +
      '<p class="fund__r">' + esc(r || '') + '</p></div>'
    ).join('') + '</div>';
}

/* ---------------- rows ---------------- */
function addrBtn(a, label) {
  if (!a) return '<span class="mono">—</span>';
  return '<button type="button" class="addr" data-addr="' + esc(String(a).toLowerCase()) + '" title="View KYC record and activity">' +
    esc(label || sh(a)) + '</button>';
}

function chipFor(status) {
  const c = ['OPEN', 'PAID', 'COMPLETED', 'CANCELLED', 'ACTIVE', 'FILLED'].includes(status) ? status : 'CANCELLED';
  return '<span class="chip chip--' + c + '">' + esc(status) + '</span>';
}

function tradeRow(t) {
  const over = t.releasedByOwner ? '<span class="chip chip--override">override</span>' : '';
  const bad = (t.payoutAnomaly ? '<span class="chip chip--stuck">payout unverified</span>' : '') +
    (t.stuck ? '<span class="chip chip--stuck">stuck</span>' : '') +
    (t.realScreenshotCount > 0 ? '<span class="chip chip--done">' + t.realScreenshotCount + ' shot</span>' : '') +
    (t.chat.length ? '<span class="chip chip--plain">' + t.chat.length + ' msg</span>' : '');
  return '<div class="row" data-id="t' + t.id + '" id="trade-' + t.id + '">' +
    '<div class="row__head" role="button" tabindex="0">' +
      '<div class="row__id">#' + t.id + '</div>' +
      '<div class="row__pair">' + esc(t.pair) + ' · ' + (t.isFiat ? 'INR' : 'CRYPTO') +
        '<br><span class="mono">buy ' + esc(sh(t.buyer)) + ' · sell ' + esc(sh(t.seller)) + '</span></div>' +
      '<div class="row__amt">' + esc(t.cryptoAmount) + ' ' + esc(t.token) + '<br><span class="implied">₹' + esc(t.quoteAmountInr) + '</span></div>' +
      '<div style="text-align:right">' + chipFor(t.status) + (over ? ' ' + over : '') + '</div>' +
      '<div class="caret">▶</div>' +
      '<div class="row__badges">' + bad + '</div>' +
    '</div><div class="row__body">' + tradeBody(t) + '</div></div>';
}

function tradeBody(t) {
  const kv = [];
  const row = (k, v) => kv.push('<div class="kv"><dt>' + esc(k) + '</dt><dd>' + v + '</dd></div>');

  let extra = '';
  if (t.stuck || (t.escrowState && t.escrowState !== 'RELEASED')) {
    extra += '<div class="reason' + (t.stuck ? ' is-stuck' : '') + '"><div class="reason__t">' +
      esc(t.escrowState || 'holding') + '</div><p>' + esc(t.reason || '') + '</p>' +
      (t.exitPath ? '<p><b>Exit:</b> ' + esc(t.exitPath) + '</p>' : '') + '</div>';
  }
  if (t.payoutAnomaly) {
    extra += '<div class="reason is-stuck"><div class="reason__t">Payout not confirmed</div><p>' + esc(t.payoutAnomaly) + '</p></div>';
  }

  row('Status', chipFor(t.status));
  row('Started', esc(dt(t.startedAt)));
  if (t.deadline) row('Payment window closes', esc(dt(t.deadline)));
  row('Seller', addrBtn(t.seller));
  row('Buyer', addrBtn(t.buyer));
  row('Crypto', esc(t.cryptoAmount) + ' ' + esc(t.token));
  row('INR value', '₹' + esc(t.quoteAmountInr));
  if (t.markedPaidAt) row('INR marked paid', esc(dt(t.markedPaidAt)) + '<br>' + addrBtn(t.markedPaidBy));
  if (t.closedAt) {
    row('Released / refunded', esc(dt(t.closedAt)) + '<br>' + addrBtn(t.releasedBy) + ' · ' + esc(t.releaseFunction || '?') +
      (t.releasedByOwner ? ' <span class="chip chip--override">OWNER OVERRIDE</span>' : ''));
    if (t.payoutSent !== undefined && t.payoutSent !== null) {
      row('Left escrow', esc(t.payoutSent) + ' ' + esc(t.token) + (t.payoutVerified ? ' <span class="chip chip--done">verified</span>' : ''));
    }
    if (t.releaseSentTo) row('Sent to', addrBtn(t.releaseSentTo));
  } else {
    row('Released / refunded', '<span class="empty">still in escrow</span>');
  }
  if (t.releaseTx) row('Closing tx', '<a href="' + esc(bscTx(t.releaseTx)) + '" target="_blank" rel="noopener">' + esc(t.releaseTx.slice(0, 14)) + '…</a>');

  const chat = t.chat.length
    ? t.chat.map(c => '<div class="msg"><div class="msg__h"><span>' + addrBtn(c.sender) + '</span><span>' + esc(dt(c.time)) + '</span></div><div class="msg__x">' + esc(c.text) + '</div></div>').join('')
    : '<div class="empty">No messages.</div>';

  const real = t.screenshots.filter(s => s.hasProof).length;
  const shots = t.screenshots.length
    ? t.screenshots.map(s => s.hasProof
        ? '<div class="shot">' + imgBox(s.cid, 'payment screenshot') +
          '<span class="ev__t">' + esc(dt(s.time)) + ' · ' + esc(sh(s.sender)) + '</span></div>'
        : '<div class="shot"><span class="empty">No proof — the contract requires a non-empty string, so <code>' + esc(s.cid) + '</code> was written instead of an image.</span></div>'
      ).join('')
    : '<div class="empty">None shared.</div>';

  const tl = [];
  if (t.startedAt) tl.push([t.startedAt, 'TradeStarted', 'trade opened on ad #' + t.adId]);
  for (const c of t.chat) tl.push([c.time, 'ChatMessage', sh(c.sender) + ': ' + c.text]);
  for (const s of t.screenshots) if (s.hasProof) tl.push([s.time, 'ScreenshotShared', sh(s.sender) + ' shared a payment screenshot']);
  if (t.markedPaidAt) tl.push([t.markedPaidAt, 'FiatMarkedPaid', sh(t.markedPaidBy) + ' marked the INR as sent']);
  for (const c of t.confirmations) tl.push([c.time, 'TradeConfirmed', sh(c.wallet) + ' confirmed']);
  if (t.closedAt) tl.push([t.closedAt, t.status === 'COMPLETED' ? 'TradeCompleted' : 'TradeCancelled',
    (t.status === 'COMPLETED' ? 'crypto released to buyer' : 'escrow returned') + ' by ' + sh(t.releasedBy) + ' via ' + (t.releaseFunction || '?')]);
  tl.sort((a, b) => String(a[0] || '').localeCompare(String(b[0] || '')));
  const timeline = tl.map(([time, name, m]) =>
    '<div class="ev"><div class="ev__t">' + esc(dt(time)) + '</div><div class="ev__b"><span class="ev__n">' + esc(name) + '</span><div class="ev__m">' + esc(m) + '</div></div></div>'
  ).join('') || '<div class="empty">No events.</div>';

  return extra + '<div class="grid">' +
    '<div class="blk"><div class="blk__t">Escrow</div><dl class="dl">' + kv.join('') + '</dl></div>' +
    '<div class="blk"><div class="blk__t">Chat <span class="count">' + t.chat.length + '</span></div><div class="tl">' + chat + '</div></div>' +
    '<div class="blk"><div class="blk__t">Payment proof <span class="count">' + real + '/' + t.screenshots.length + '</span></div><div class="tl">' + shots + '</div></div>' +
    '<div class="blk"><div class="blk__t">Timeline</div><div class="tl">' + timeline + '</div></div>' +
  '</div>';
}

function adRow(a) {
  const mod = a.outcome === 'ACTIVE' ? 'ACTIVE' : a.outcome === 'FILLED' ? 'FILLED' : 'CANCELLED';
  return '<div class="row" data-id="a' + a.id + '">' +
    '<div class="row__head" role="button" tabindex="0">' +
      '<div class="row__id">#' + a.id + '</div>' +
      '<div class="row__pair">' + esc(a.pair) + ' · ' + esc(a.side) + '<br><span class="mono">by ' + esc(sh(a.creator)) + '</span></div>' +
      '<div class="row__amt">' + esc(a.remainingCrypto) + ' left<br><span class="implied">of ' + esc(a.originalCrypto) + '</span></div>' +
      '<div style="text-align:right"><span class="chip chip--' + mod + '">' + esc(a.outcome) + '</span></div>' +
      '<div class="caret">▶</div>' +
      '<div class="row__badges">' + (a.tradesTaken.length ? '<span class="chip chip--plain">' + a.tradesTaken.length + ' trades</span>' : '') + '</div>' +
    '</div><div class="row__body"><div class="grid"><div class="blk"><div class="blk__t">Order</div><dl class="dl">' +
      '<div class="kv"><dt>Creator</dt><dd>' + addrBtn(a.creator) + '</dd></div>' +
      '<div class="kv"><dt>Original</dt><dd>' + esc(a.originalCrypto) + ' for ₹' + esc(a.originalQuoteInr) + '</dd></div>' +
      '<div class="kv"><dt>Remaining</dt><dd>' + esc(a.remainingCrypto) + '</dd></div>' +
      '<div class="kv"><dt>Created</dt><dd>' + esc(dt(a.createdAt)) + '</dd></div>' +
      (a.cancelledAt ? '<div class="kv"><dt>Cancelled</dt><dd>' + esc(dt(a.cancelledAt)) + '</dd></div>' : '') +
      '<div class="kv"><dt>Trades taken</dt><dd>' + (a.tradesTaken.length ? a.tradesTaken.map(x => '#' + x).join(', ') : 'none') + '</dd></div>' +
    '</dl></div></div></div></div>';

function personRow(p) {
  const n = tcount(p);
  return '<div class="row" data-id="p' + p.wallet + '">' +
    '<div class="row__head" role="button" tabindex="0">' +
      '<div class="row__id">' + (p.verified ? '<span class="chip chip--done">OK</span>' : '<span class="chip chip--closed">NEW</span>') + '</div>' +
      '<div class="row__pair"><b>' + esc(p.bankHolderName || '(no name on record)') + '</b><br><span class="mono">' + esc(p.wallet) + '</span></div>' +
      '<div class="row__amt">' + n + ' trade' + (n === 1 ? '' : 's') + '<br><span class="implied">' +
        p.ordersCreated.length + ' order' + (p.ordersCreated.length === 1 ? '' : 's') + ' · ' + p.chatMessages + ' msg</span></div>' +
      '<div style="text-align:right">' + chipFor(p.verified ? 'COMPLETED' : 'CANCELLED') + '</div>' +
      '<div class="caret">▶</div>' +
      '<div class="row__badges">' +
        (p.timesSubmitted > 1 ? '<span class="chip chip--plain">RESUBMITTED ×' + p.timesSubmitted + '</span>' : '') +
        (p.hasAadhaar ? '<span class="chip chip--done">AADHAAR</span>' : '<span class="chip chip--stuck">NO AADHAAR</span>') +
        (p.verificationChanges > 1 ? '<span class="chip chip--plain">STATUS ×' + p.verificationChanges + '</span>' : '') +
      '</div>' +
    '</div><div class="row__body">' + personBody(p) + '</div></div>';
}

function personBody(p) {
  const kv = [];
  const row = (k, v) => kv.push('<div class="kv"><dt>' + esc(k) + '</dt><dd>' + v + '</dd></div>');
  row('Submitted', esc(dt(p.submittedAt)));
  row('Verified', p.verifiedAt ? esc(dt(p.verifiedAt)) + (p.verified ? ' <span class="implied">(' + esc(lag(p.submittedAt, p.firstVerifiedAt || p.verifiedAt)) + ')</span>' : '') : 'never');
  row('Mobile', esc(p.mobile || '—'));
  row('Email', esc(p.email || '—'));
  row('PAN', esc(p.pan || '—'));
  row('Bank', esc(p.bankName || '—'));
  row('Times submitted', String(p.timesSubmitted));

  const sell = new Set(p.tradesAsSeller), buy = new Set(p.tradesAsBuyer);
  const mine = DATA.trades.filter(t => sell.has(t.id) || buy.has(t.id));
  const myAds = DATA.ads.filter(a => p.ordersCreated.includes(a.id));

  const tradeRows = mine.length ? mine.map(t => {
    const sold = sell.has(t.id);
    return '<tr><td>#' + t.id + '</td><td><span class="chip chip--' + (sold ? 'sell' : 'buy') + '">' +
      (sold ? 'SOLD' : 'BOUGHT') + '</span></td><td>' + esc(t.pair) + '</td>' +
      '<td class="n">' + esc(t.cryptoAmount) + '</td><td>' + chipFor(t.status) + '</td>' +
      '<td>' + addrBtn(sold ? t.buyer : t.seller) + '</td><td class="w">' + esc(dt(t.startedAt)) + '</td></tr>';
  }).join('') : '<tr><td colspan="7" class="w">No trades.</td></tr>';

  const adRows = myAds.length ? myAds.map(a =>
    '<tr><td>#' + a.id + '</td><td>' + esc(a.side) + '</td><td>' + esc(a.pair) + '</td>' +
    '<td class="n">' + esc(a.originalCrypto) + '</td><td class="n">' + esc(a.remainingCrypto) + '</td>' +
    '<td>' + chipFor(a.outcome) + '</td><td class="w">' + esc(dt(a.createdAt)) + '</td></tr>'
  ).join('') : '<tr><td colspan="7" class="w">No orders listed.</td></tr>';

  // One transcript, both sides labelled, interleaved by block so it reads in
  // the order it happened rather than messages-then-images.
  const lines = [];
  for (const t of mine) {
    const role = sell.has(t.id) ? 'sold' : 'bought';
    const merged = []
      .concat(t.chat.map(c => ({ b: c.block, c, s: null })))
      .concat(t.screenshots.map(s => ({ b: s.block, c: null, s })))
      .sort((a, b) => a.b - b.b);
    for (const m of merged) {
      lines.push({ b: m.b, role, tid: t.id, time: m.c ? m.c.time : (m.s ? m.s.time : null),
        text: m.c ? m.c.text : '', shot: m.s, sender: m.c ? m.c.sender : (m.s ? m.s.sender : '') });
    }
  }
  lines.sort((a, b) => a.b - b.b);
  const transcript = lines.length ? lines.map(l =>
    '<div class="aline"><div class="aline__when">' + esc(dt(l.time)) + '</div>' +
    '<div class="aline__role aline__role--' + l.role + '">' + (l.role === 'sold' ? 'SOLD' : 'BOUGHT') + '</div>' +
    '<div class="aline__trade"><span class="mono">#' + l.tid + '</span></div>' +
    '<div class="aline__body">' + (l.shot
      ? (l.shot.hasProof ? imgBox(l.shot.cid, 'payment screenshot', 'shot') : '<em class="implied">screenshot placeholder only — no image was shared</em>')
      : esc(l.text || 'empty message')) + '</div></div>'
  ).join('') : '<div class="empty" style="padding:11px">No chat messages.</div>';

  return '<div class="grid">' +
    '<div class="blk"><div class="blk__t">KYC summary</div><dl class="dl">' + kv.join('') + '</dl>' +
      '<button type="button" class="btn" style="margin-top:10px" data-addr="' + esc(p.wallet) + '">Full KYC record &amp; Aadhaar</button></div>' +
  '</div>' +
  '<div class="drw__h3">Trades <span class="count">' + mine.length + '</span></div>' +
  '<div class="tscroll"><table class="tbl"><thead><tr><th>ID</th><th>Side</th><th>Pair</th><th class="n">Amount</th><th>Status</th><th>Other party</th><th>Started</th></tr></thead><tbody>' + tradeRows + '</tbody></table></div>' +
  '<div class="drw__h3">Orders <span class="count">' + myAds.length + '</span></div>' +
  '<div class="tscroll"><table class="tbl"><thead><tr><th>ID</th><th>Side</th><th>Pair</th><th class="n">Original</th><th class="n">Remaining</th><th>Status</th><th>Created</th></tr></thead><tbody>' + adRows + '</tbody></table></div>' +
  '<div class="drw__h3">Chat <span class="count">' + p.chatMessages + '</span></div>' +
  '<div class="blk" style="padding:0;max-height:26rem;overflow:auto">' + transcript + '</div>';
}

/* ---------------- drawer ---------------- */
function docImg(hash, label) {
  if (!hash) return '<div class="doc"><div class="doc--empty"><span class="doc__t">' + esc(label) + '</span>No reference stored.</div></div>';
  if (!realCid(hash)) return '<div class="doc"><div class="doc--empty"><span class="doc__t">' + esc(label) +
    '</span>No document supplied — the contract stores <code>' + esc(hash) + '</code> as a placeholder.</div></div>';
  return '<div class="doc"><button type="button" class="doc__zoom" data-img="' + esc(hash) + '" aria-label="Open the ' + esc(label) + ' Aadhaar document full size">' +
    '<img src="' + esc(GATEWAYS[0].u(hash)) + '" alt="' + esc(label) + ' Aadhaar document" /></button>' +
    '<span class="doc__cap">' + esc(label) + ' · <a href="' + esc(GATEWAYS[0].u(hash)) + '" target="_blank" rel="noopener">' +
    esc(hash.slice(0, 6)) + '…' + esc(hash.slice(-4)) + '</a></span></div>';
}

function openDrawer(addr) {
  const w = String(addr).toLowerCase();
  const rec = KYC.get(w);
  const p = PEOPLE.get(w);

  const badges = [];
  if (rec) {
    badges.push(rec.verified ? '<span class="chip chip--done">VERIFIED</span>' : '<span class="chip chip--closed">UNVERIFIED</span>');
    if (rec.timesSubmitted > 1) badges.push('<span class="chip chip--plain">RESUBMITTED ×' + rec.timesSubmitted + '</span>');
    if (rec.viaRouter) badges.push('<span class="chip chip--plain">VIA ROUTER</span>');
  }

  const fields = [];
  const F = (k, v) => fields.push('<div class="kv"><dt>' + esc(k) + '</dt><dd>' + esc(v || '—') + '</dd></div>');

  let content;
  if (!rec) {
    content = '<div class="empty">No KYC submission found for this address. Either they never applied, or the transaction could not be read when the index was built.</div>';
  } else {
    F('Name', rec.bankHolderName);
    F('Mobile', rec.mobile);
    F('Email', rec.email);
    F('PAN', rec.pan);
    F('Bank', rec.bankName);
    F('Account', rec.bankAccountNumber);
    F('IFSC', rec.ifscCode);
    F('Submitted', dt(rec.submittedAt));
    F('Last updated', rec.updatedAt ? dt(rec.updatedAt) : 'never');
    F('Verified', rec.verifiedAt ? dt(rec.verifiedAt) + (rec.verified ? ' (' + (lag(rec.submittedAt, rec.firstVerifiedAt || rec.verifiedAt) || '—') + ')' : '') : 'never');
    F('Times submitted', String(rec.timesSubmitted));
    content =
      '<div class="drw__badges">' + badges.join('') + '</div>' +
      '<dl class="dl">' + fields.join('') + '</dl>' +
      '<div class="drw__h3">Aadhaar documents</div><div class="docs">' +
        docImg(rec.aadharFrontHash, 'Front') + docImg(rec.aadharBackHash, 'Back') + '</div>' +
      '<p class="drw__note">Read from tx <a href="' + esc(bscTx(rec.tx)) + '" target="_blank" rel="noopener">' +
        esc(rec.tx.slice(0, 14)) + '…</a> at block ' + rec.block +
        '. No wallet needed: these fields sit in public transaction calldata, and only the document CIDs go to IPFS.' +
        (p ? '' : '') + '</p>' +
      (p ? personActivity(p) : '<div class="drw__h3">Activity</div><div class="empty">No trades or orders on record.</div>');
  }

  const box = document.createElement('div');
  box.className = 'drw';
  box.innerHTML =
    '<div class="drw__scrim"></div><div class="drw__panel" role="dialog" aria-modal="true">' +
    '<div class="drw__head"><div><h2>KYC record</h2>' +
    '<a class="drw__addr" href="' + esc(bscAd(addr)) + '" target="_blank" rel="noopener">' + esc(addr) + '</a></div>' +
    '<button type="button" class="drw__x" aria-label="Close">✕</button></div>' +
    content + '</div>';

  const close = () => { box.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  $('.drw__scrim', box).onclick = close;
  $('.drw__x', box).onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.style.overflow = 'hidden';
  document.body.appendChild(box);
  wireImages(box);
  wireLightbox(box);
  wireAddrs(box);
}

function personActivity(p) {
  const sell = new Set(p.tradesAsSeller), buy = new Set(p.tradesAsBuyer);
  const mine = DATA.trades.filter(t => sell.has(t.id) || buy.has(t.id));
  const myAds = DATA.ads.filter(a => p.ordersCreated.includes(a.id));
  if (!mine.length && !myAds.length) {
    return '<div class="drw__h3">Activity</div><div class="empty">This person has never traded or listed an order. They submitted KYC ' +
      (p.submittedAt ? 'on ' + dt(p.submittedAt) : '') + ' and are ' + (p.verified ? 'verified' : 'not verified') + '.</div>';
  }
  return '<div class="drw__h3">Summary</div><dl class="dl">' +
    '<div class="kv"><dt>Sold in</dt><dd>' + (p.tradesAsSeller.length ? p.tradesAsSeller.map(x => '#' + x).join(', ') : '—') + '</dd></div>' +
    '<div class="kv"><dt>Bought in</dt><dd>' + (p.tradesAsBuyer.length ? p.tradesAsBuyer.map(x => '#' + x).join(', ') : '—') + '</dd></div>' +
    '<div class="kv"><dt>Orders created</dt><dd>' + (p.ordersCreated.length ? p.ordersCreated.map(x => '#' + x).join(', ') : '—') + '</dd></div>' +
    '<div class="kv"><dt>Chat messages</dt><dd>' + p.chatMessages + '</dd></div></dl>';
}

function wireAddrs(root) {
  $$('[data-addr]', root || document).forEach(b => {
    b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openDrawer(b.dataset.addr); };
  });
}

/* ---------------- controls + render ---------------- */
const CONTROLS = {
  trades: [
    ['search', 'q', 'Search id, wallet, name, chat text, CID…'],
    ['select', 'f-status', [['', 'All statuses'], ['OPEN', 'OPEN'], ['PAID', 'PAID'], ['COMPLETED', 'COMPLETED'], ['CANCELLED', 'CANCELLED']]],
    ['select', 'f-sort', [['desc', 'Latest first'], ['asc', 'Oldest first']]],
    ['select', 'f-release', [['', 'All releases'], ['override', 'Owner override only'], ['normal', 'Normal confirmation only'], ['indirect', 'Sent via router']]],
    ['select', 'f-proof', [['any', 'All — every payment-proof state'], ['yes', 'Has a real screenshot'], ['no', 'No screenshot at all'], ['placeholder', 'Placeholder instead of an image']]],
    ['select', 'f-escrow', [['', 'All escrow states'], ['stuck', 'Stuck — expired, needs cancelling'], ['holding', 'Currently holding escrow'], ['awaitingSeller', 'Waiting on seller confirmation'], ['awaitingBuyer', 'Waiting on buyer payment'], ['anomaly', 'Payout not confirmed']]],
  ],
  ads: [
    ['search', 'q', 'Search id, wallet, pair…'],
    ['select', 'f-sort', [['desc', 'Highest id first'], ['asc', 'Lowest id first']]],
  ],
  people: [
    ['search', 'q', 'Search name, email, mobile, PAN, wallet, or a trade id…'],
    ['select', 'f-sortby', [['submitted', 'Sort by submission date'], ['verified', 'Sort by verification date'], ['activity', 'Sort by trade count']]],
    ['select', 'f-sort', [['desc', 'Latest first'], ['asc', 'Oldest first']]],
    ['select', 'f-kyc', [['', 'Every KYC state'], ['verified', 'Verified only'], ['unverified', 'Submitted, never verified'], ['traded', 'Has traded'], ['never-traded', 'Never traded'], ['listed', 'Has listed an order'], ['resubmitted', 'Resubmitted at least once'], ['no-aadhaar', 'No Aadhaar image']]],
  ],
};

const TRADE_KEYWORDS = {
  stuck: (t) => !!t.stuck, expired: (t) => t.escrowState === 'EXPIRED_UNCLAIMED',
  unclaimed: (t) => t.escrowState === 'EXPIRED_UNCLAIMED', holding: (t) => t.escrowState !== 'RELEASED',
  released: (t) => t.escrowState === 'RELEASED', override: (t) => !!t.releasedByOwner,
  router: (t) => !!t.releaseWasIndirect, unconfirmed: (t) => !!t.payoutAnomaly,
  anomaly: (t) => !!t.payoutAnomaly, paid: (t) => t.status === 'PAID', open: (t) => t.status === 'OPEN',
  completed: (t) => t.status === 'COMPLETED', cancelled: (t) => t.status === 'CANCELLED',
  chat: (t) => t.chat.length > 0, screenshot: (t) => t.realScreenshotCount > 0,
};

const PERSON_KEYWORDS = {
  verified: (p) => p.verified, unverified: (p) => !p.verified,
  seller: (p) => p.tradesAsSeller.length > 0, buyer: (p) => p.tradesAsBuyer.length > 0,
  chat: (p) => p.chatMessages > 0, aadhaar: (p) => p.hasAadhaar,
  resubmitted: (p) => p.timesSubmitted > 1,
};

function nameOf(a) { const p = a ? PEOPLE.get(String(a).toLowerCase()) : null; return p ? p.bankHolderName : ''; }

function filtered() {
  const q = ($('#q') ? $('#q').value : '').trim().toLowerCase();
  const dir = ($('#f-sort') ? $('#f-sort').value : 'desc') === 'asc' ? 1 : -1;

  if (TAB === 'trades') {
    const st = $('#f-status').value, rel = $('#f-release').value, pf = $('#f-proof').value, es = $('#f-escrow').value;
    const asId = /^\d+$/.test(q) ? Number(q) : null;
    let list = DATA.trades.filter(t => {
      if (PIN && !PIN.has(t.id)) return false;
      if (st && t.status !== st) return false;
      if (rel === 'override' && !t.releasedByOwner) return false;
      if (rel === 'normal' && t.releasedByOwner) return false;
      if (rel === 'indirect' && !t.releaseWasIndirect) return false;
      if (pf === 'yes' && t.realScreenshotCount === 0) return false;
      if (pf === 'no' && t.realScreenshotCount > 0) return false;
      if (pf === 'placeholder' && !t.screenshots.some(s => !s.hasProof)) return false;
      if (es === 'stuck' && !t.stuck) return false;
      if (es === 'holding' && (t.stuck === undefined || t.escrowState === 'RELEASED')) return false;
      if (es === 'awaitingSeller' && t.escrowState !== 'AWAITING_SELLER') return false;
      if (es === 'awaitingBuyer' && t.escrowState !== 'AWAITING_BUYER') return false;
      if (es === 'anomaly' && !t.payoutAnomaly) return false;
      if (!q) return true;
      // A bare number is an id, full stop. Substring matching made "37" return
      // 19 trades because it also matched 137, 237 and 731.
      if (asId !== null) return t.id === asId;
      if (TRADE_KEYWORDS[q] && TRADE_KEYWORDS[q](t)) return true;
      return [t.seller, t.buyer, t.pair, t.status, t.releaseFunction, t.adId, t.releasedBy,
        t.markedPaidBy, t.releaseSentTo, t.reason, t.escrowState, t.outcome,
        ...t.confirmations.map(c => c.wallet), ...t.chat.map(c => c.text),
        ...t.chat.map(c => c.sender), ...t.screenshots.map(s => s.cid),
        ...t.screenshots.map(s => s.sender),
        nameOf(t.seller), nameOf(t.buyer), nameOf(t.releasedBy)]
        .join(' ').toLowerCase().includes(q);
    });
    list.sort((a, b) => (a.id - b.id) * dir);
    return list;
  }

  if (TAB === 'ads') {
    const asId = /^\d+$/.test(q) ? Number(q) : null;
    return DATA.ads.filter(a => {
      if (!q) return true;
      if (asId !== null) return a.id === asId;
      return [a.creator, a.pair, a.side, a.outcome, nameOf(a.creator),
        ...a.tradesTaken.map(x => '#' + x)].join(' ').toLowerCase().includes(q);
    }).sort((a, b) => (a.id - b.id) * dir);
  }

  const ks = $('#f-kyc').value, sortBy = $('#f-sortby').value;
  const asId = /^\d+$/.test(q) ? Number(q) : null;
  const key = (p) => sortBy === 'verified' ? (p.verifiedAt || '')
    : sortBy === 'activity' ? String(tcount(p)).padStart(6, '0')
    : (p.submittedAt || '');

  return [...PEOPLE.values()].filter(p => {
    if (ks === 'verified' && !p.verified) return false;
    if (ks === 'unverified' && p.verified) return false;
    if (ks === 'traded' && tcount(p) === 0) return false;
    if (ks === 'never-traded' && tcount(p) > 0) return false;
    if (ks === 'listed' && p.ordersCreated.length === 0) return false;
    if (ks === 'resubmitted' && p.timesSubmitted < 2) return false;
    if (ks === 'no-aadhaar' && p.hasAadhaar) return false;
    if (!q) return true;
    if (asId !== null) return p.tradesAsSeller.includes(asId) || p.tradesAsBuyer.includes(asId) || p.ordersCreated.includes(asId);
    if (PERSON_KEYWORDS[q] && PERSON_KEYWORDS[q](p)) return true;
    return [p.wallet, p.bankHolderName, p.email, p.mobile, p.pan, p.bankName].join(' ').toLowerCase().includes(q);
  }).sort((a, b) => {
    // Ties follow the chosen direction, so toggling order gives a true mirror.
    // A record with no timestamp sorts last both ways: a missing date must
    // never appear as the newest.
    const ta = key(a), tb = key(b);
    if (!ta && !tb) return a.wallet.localeCompare(b.wallet) * dir;
    if (!ta) return 1;
    if (!tb) return -1;
    if (ta === tb) return a.wallet.localeCompare(b.wallet) * dir;
    return (ta < tb ? -1 : 1) * dir;
  });
}

function buildControls() {
  const box = $('#controls');
  box.innerHTML = CONTROLS[TAB].map(([kind, id, spec]) => {
    if (kind === 'search') return '<input type="search" id="' + id + '" placeholder="' + esc(spec) + '" />';
    return '<select id="' + id + '">' + spec.map(([v, l]) =>
      '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('') + '</select>';
  }).join('') + '<span class="hint" id="count"></span>';
  $$('#controls input, #controls select').forEach(el => {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });
}

function render() {
  const list = filtered();
  const count = $('#count');
  if (PIN) {
    $('#controls').insertAdjacentHTML('afterbegin',
      '<span class="jump">Showing ' + PIN.size + ' trade' + (PIN.size === 1 ? '' : 's') +
      ' from one person <button type="button" class="btn" id="unpin">Show all</button></span>');
    $('#unpin').onclick = () => { PIN = null; render(); };
  }

  let html;
  if (TAB === 'trades') html = list.map(tradeRow).join('');
  else if (TAB === 'ads') html = list.map(adRow).join('');
  else html = list.map(personRow).join('');

  $('#list').innerHTML = html ||
    '<div class="empty" style="padding:34px;text-align:center">Nothing matches those filters.</div>';
  if (count) count.textContent = list.length + ' shown';

  $$('.row__head').forEach(h => {
    const toggle = () => {
      const r = h.parentElement;
      r.classList.toggle('is-open');
      const id = r.dataset.id;
      if (r.classList.contains('is-open')) { OPEN.add(id); renderOpen(r); } else OPEN.delete(id);
    };
    h.onclick = toggle;
    h.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  });
  $$('.row').forEach(r => { if (OPEN.has(r.dataset.id)) r.classList.add('is-open'); });
  wireAddrs();
  wireImages();
  wireLightbox();
}

/* Body is built once but images inside collapsed rows still need wiring when
   the row opens, otherwise a retry cascade is never attached to them. */
function renderOpen(row) {
  wireImages(row);
  wireLightbox(row);
  wireAddrs(row);
}

function boot() {
  let d;
  try {
    d = JSON.parse(document.getElementById('audit-data').textContent);
  } catch (e) {
    $('#meta').textContent = 'Could not parse the embedded data: ' + e.message;
    return;
  }
  DATA = d;
  KYC = new Map((d.kyc || []).map(r => [r.wallet.toLowerCase(), r]));
  PEOPLE = new Map((d.kyc || []).map(r => {
    const w = r.wallet.toLowerCase();
    return [w, {
      wallet: w, bankHolderName: (r.bankHolderName || '').trim(), mobile: r.mobile || '',
      email: r.email || '', pan: r.pan || '', bankName: (r.bankName || '').trim(),
      submittedAt: r.submittedAt, verified: !!r.verified, verifiedAt: r.verifiedAt,
      firstVerifiedAt: r.firstVerifiedAt, verificationChanges: r.verificationChanges || 0,
      timesSubmitted: r.timesSubmitted || 1,
      hasAadhaar: realCid(r.aadharFrontHash) && realCid(r.aadharBackHash),
      tradesAsSeller: r.tradesAsSeller || [], tradesAsBuyer: r.tradesAsBuyer || [],
      ordersCreated: r.ordersCreated || [], chatMessages: r.chatMessages || 0,
    }];
  }));

  $('#meta').innerHTML = 'generated <b>' + esc(d.generatedAt.replace('T', ' ').slice(0, 19)) + ' UTC</b> · blocks <b>' +
    d.blockRange.deployBlock.toLocaleString() + '</b> → <b>' + d.blockRange.head.toLocaleString() + '</b>';
  $('#contract').innerHTML = 'contract <b>' + esc(d.contract) + '</b><br>owner <b>' + esc(d.escrowOwner) + '</b>';
  $('#stats').innerHTML = statsBlock(d.summary);
  $('#funds').innerHTML = fundsBlock(d.summary);
  $('#n-trades').textContent = d.summary.trades;
  $('#n-ads').textContent = d.summary.ads;
  $('#n-kyc').textContent = (d.kyc || []).length;

  const un = Number(d.summary.escrowUnattributed);
  if (un > 0.0001) {
    $('#alert').innerHTML = '<div class="banner"><b>' + esc(d.summary.escrowUnattributed) + ' JSAV</b> sits in the escrow ' +
      'contract but backs no open trade. Only <b>' + esc(d.summary.escrowedInOpenTrades) + ' JSAV</b> is attributable to ' +
      'trades in progress. Filter Trades → escrow state → <b>stuck</b> to see what needs cancelling.</div>';
  }

  // Aadhaar images and payment screenshots live on IPFS, so viewing them needs
  // a connection. Everything else on this page works with none.
  if (!navigator.onLine) {
    $('#offline').className = 'offline is-on';
    $('#offline').innerHTML = '<b>No connection.</b> Every record, KYC field, chat message and trade below is stored in this file and is readable now. ' +
      'Aadhaar images and payment screenshots are the exception: they are fetched from IPFS and need data or wifi to appear.';
  }

  $$('.tab').forEach(t => {
    t.onclick = () => {
      $$('.tab').forEach(x => x.classList.remove('is-active'));
      t.classList.add('is-active');
      TAB = t.dataset.tab;
      PIN = null;
      buildControls();
      render();
      window.scrollTo({ top: $('.tabs').offsetTop - 8, behavior: 'smooth' });
    };
  });

  buildControls();
  render();
  window.addEventListener('online', () => $('#offline').className = 'offline');
}

boot();
</script>
</body>
</html>
